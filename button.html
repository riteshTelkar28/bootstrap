<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <script src="bootstrap-3.3.7-dist/js/jquery-3.7.1.min.js"></script>
    <script src="bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="bootstrap-3.3.7-dist/css/bootstrap.min.css">
</head> 
<body>
    <button>Button</button>
    <button class="btn">Button</button>
    <button class="btn btn-danger">Button</button>
    <button class="btn btn-default">Button</button>
    <button class="btn btn-primary">Button</button>
    <button class="btn btn-info">Button</button>
    <button class="btn btn-success" >Button</button>
    <button class="btn btn-warning">Button </button>
    <button class="btn btn-block">Button</button>

    <button class="btn btn-xs btn-danger">Button</button>
    <button class="btn btn-sm btn-warning">Button</button>
    <button class="btn btn-md btn-primary">Button</button>
    <button class=" btn btn-lg btn-info">Button</button> <br>

    <button  disabled class="btn btn-success glyphicon glyphicon-home"></button>
    <button class="btn btn-warning glyphicon glyphicon-search"></button>
    <button class="btn btn-primary glyphicon glyphicon-comment"></button>
    <button class="btn btn-info glyphicon glyphicon-tag"></button>

</html>
