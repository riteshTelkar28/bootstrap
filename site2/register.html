<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in/Sign-up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="/Images/glogo.png" alt="Grocery Stop Logo" height="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-danger" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="address.html">Select Location</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="register.html">Sign-in/Sign-up</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="offers.html">Special Offers</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                </form>
            </div>
        </div>
    </nav>

    <!-- Categories Row -->
    <div class="container-fluid bg-dark text-white py-3">
        <div class="row text-center">
            <div class="col-12 col-md-2 my-1">Select By Category</div>
            <div class="col-6 col-md-2 my-1"><a href="#" class="text-white text-decoration-none">Fruits & Vegetables</a></div>
            <div class="col-6 col-md-2 my-1"><a href="#" class="text-white text-decoration-none">Foodgrains, Oil & Masala</a></div>
            <div class="col-6 col-md-2 my-1"><a href="#" class="text-white text-decoration-none">Eggs, Meat & Fish</a></div>
            <div class="col-6 col-md-2 my-1"><a href="#" class="text-white text-decoration-none">Bakery, Cakes & Dairy</a></div>
        </div>
    </div>

    <!-- Login Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h2>Login Form</h2>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">Enter Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Enter Username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Enter Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter Password">
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-success w-45">Sign-up</button>
                                <button type="reset" class="btn btn-danger w-45">Reset</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <p>Not having an account? <a href="#" class="text-primary">Click here to sign-in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
